<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - EVIL</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="evil-theme">
  <main>
    <div class="login-container">
      <div class="login-form">
        <h1>Reset Password</h1>
        <p>Inserisci il token di reset e la nuova password.</p>
        <form id="resetForm">
          <div class="form-group">
            <label for="reset-token">Token di reset:</label>
            <input type="text" id="reset-token" name="reset-token" placeholder="Inserisci il token ricevuto" required>
          </div>
          <div class="form-group">
            <label for="new-password">Nuova Password:</label>
            <input type="password" id="new-password" name="new-password" placeholder="Nuova password" required>
          </div>
          <div class="form-group">
            <label for="confirm-password">Conferma Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Conferma password" required>
          </div>
          <div id="resetError" class="error-message"></div>
          <div id="resetSuccess" class="success-message"></div>
          <button type="submit" class="btn-login">Reimposta password</button>
        </form>
        <div class="login-link">
          Torna a <a href="login.html">Login</a>
        </div>
      </div>
    </div>
  </main>

  <style>
    .login-container { max-width: 480px; margin: 80px auto; padding: 20px; }
    .login-form { background: rgba(0,0,0,0.5); border:1px solid rgba(0,255,156,0.2); border-radius:12px; padding:35px; }
    .login-form h1 { color:#00ff9c; margin-bottom:20px; }
    .form-group label { color: rgba(255,255,255,0.8); display:block; margin-bottom:8px; }
    .form-group input { width:100%; padding:12px; border-radius:4px; border:1px solid rgba(0,255,156,0.3); background: rgba(0,0,0,0.3); color:#fff; }
    .btn-login { width:100%; padding:12px; background:linear-gradient(135deg,#00ff9c,#00cc77); border:none; color:#000; font-weight:bold; border-radius:4px; cursor:pointer; }
    .btn-login:hover { transform:translateY(-2px); box-shadow:0 0 20px rgba(0,255,156,0.3); }
    .login-link { margin-top:18px; color: rgba(255,255,255,0.75); }
    .login-link a { color:#00ff9c; text-decoration:none; }
  </style>

  <script>
    const API_URL = '/api';
    const params = new URLSearchParams(window.location.search);
    const tokenParam = params.get('token');
    if (tokenParam) {
      document.getElementById('reset-token').value = decodeURIComponent(tokenParam);
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const resetToken = document.getElementById('reset-token').value;
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const errorDiv = document.getElementById('resetError');
      const successDiv = document.getElementById('resetSuccess');
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      try {
        const response = await fetch(`${API_URL}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resetToken, newPassword, confirmPassword })
        });
        const data = await response.json();

        if (!response.ok) {
          errorDiv.textContent = data.error || 'Errore reset password';
          errorDiv.style.display = 'block';
          return;
        }

        successDiv.textContent = data.message || 'Password reimpostata con successo';
        successDiv.style.display = 'block';
        setTimeout(() => { window.location.href = 'login.html'; }, 2500);
      } catch (err) {
        errorDiv.textContent = 'Errore di connessione: ' + err.message;
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
