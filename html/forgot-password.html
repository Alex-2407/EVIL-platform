<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Recupera password — EVIL Cybersecurity Platform</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Recupera l'accesso al tuo account EVIL: ricevi via email il link per scegliere una nuova password.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/site-header.css?v=20260612">
  <link rel="stylesheet" href="/css/evil-motion.css?v=20260626">
  <link rel="stylesheet" href="/css/site-footer.css?v=20260606">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/auth-pages.css?v=20260605">
<link rel="stylesheet" href="/css/system-theme.css?v=20260603e">
  <script src="/js/evil-motion.js?v=20260626" defer></script>
  <link rel="stylesheet" href="/css/evil-scrollbar.css?v=20260717">
      <style id="evil-auth-pending-style">html.evil-auth-pending .auth-buttons{visibility:hidden;pointer-events:none;min-height:2.25rem}</style>
  <script src="/js/evil-site-chrome.js?v=20260610" defer></script>
</head>
<body class="evil-theme auth-page-body auth-page-body--login">
  <div id="fade-overlay"></div>
  <canvas id="matrix-canvas"></canvas>
  <div class="auth-scene" aria-hidden="true">
    <div class="auth-scene__base"></div>
    <div class="auth-scene__glow auth-scene__glow--one"></div>
    <div class="auth-scene__glow auth-scene__glow--two"></div>
  </div>

  <!--evil:header-->

  <main>
    <div class="auth-page auth-page--narrow">
      <section class="auth-panel">
        <p class="auth-panel__kicker">Recupero accesso</p>
        <h1>Password dimenticata?</h1>
        <p class="auth-verify__lead">Inserisci l'email dell'account. Ti invieremo un link per reimpostare la password (valido 15 minuti).</p>
        <form id="forgotForm" novalidate>
          <div class="auth-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="nome@esempio.it" autocomplete="email" required>
          </div>
          <div id="forgotError" class="auth-message auth-message--error" role="alert"></div>
          <div id="forgotSuccess" class="auth-message auth-message--success" role="status"></div>
          <div id="deliveryNotice" class="auth-verify__notice" hidden></div>
          <button type="submit" class="auth-submit" id="submitBtn">Invia link di reset</button>
        </form>
        <p class="auth-switch">Ricordi la password? <a href="/login.html">Torna al login</a></p>
      </section>
    </div>
  </main>

  <!--evil:footer-->

  <script>
    const API_URL = '/api';
    const form = document.getElementById('forgotForm');
    const errorDiv = document.getElementById('forgotError');
    const successDiv = document.getElementById('forgotSuccess');
    const deliveryNotice = document.getElementById('deliveryNotice');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      deliveryNotice.hidden = true;

      const email = document.getElementById('email').value.trim();
      submitBtn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await response.json();

        if (!response.ok) {
          errorDiv.textContent = data.error || 'Errore invio richiesta';
          errorDiv.style.display = 'block';
          submitBtn.disabled = false;
          return;
        }

        successDiv.textContent = data.message || 'Controlla la tua email per il link di reset.';
        successDiv.style.display = 'block';
        if (data.emailHint) {
          deliveryNotice.textContent = data.emailHint;
          deliveryNotice.hidden = false;
        }
        form.querySelector('.auth-field').style.display = 'none';
        submitBtn.style.display = 'none';
      } catch (err) {
        errorDiv.textContent = 'Errore di connessione: ' + err.message;
        errorDiv.style.display = 'block';
        submitBtn.disabled = false;
      }
    });
  </script>
  <script src="/js/matrixrain.js" defer></script>
  <script src="/js/js.js" defer></script>
</body>
</html>
