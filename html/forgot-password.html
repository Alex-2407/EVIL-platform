<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recupera Password - EVIL</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="evil-theme">
  <main>
    <div class="login-container">
      <div class="login-form">
        <h1>Recupera Password</h1>
        <p>Inserisci la tua email per ricevere il link di reset. In questa demo il token viene mostrato direttamente.</p>
        <form id="forgotForm">
          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>
          </div>
          <div id="forgotError" class="error-message"></div>
          <div id="forgotSuccess" class="success-message"></div>
          <button type="submit" class="btn-login">Invia richiesta</button>
        </form>
        <div class="login-link">
          Torna a <a href="login.html">Login</a>
        </div>
        <div id="resetTokenLink" class="confirmation-link" style="display:none;"></div>
      </div>
    </div>
  </main>

  <style>
    .login-container {
      max-width: 480px;
      margin: 80px auto;
      padding: 20px;
    }
    .login-form {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(0,255,156,0.2);
      border-radius: 12px;
      padding: 35px;
    }
    .login-form h1 {
      color: #00ff9c;
      margin-bottom: 20px;
    }
    .form-group label { color: rgba(255,255,255,0.8); display:block; margin-bottom:8px; }
    .form-group input { width:100%; padding:12px; border-radius:4px; border:1px solid rgba(0,255,156,0.3); background: rgba(0,0,0,0.3); color:#fff; }
    .btn-login { width:100%; padding:12px; background:linear-gradient(135deg,#00ff9c,#00cc77); border:none; color:#000; font-weight:bold; border-radius:4px; cursor:pointer; }
    .btn-login:hover { transform:translateY(-2px); box-shadow:0 0 20px rgba(0,255,156,0.3); }
    .login-link { margin-top:18px; color: rgba(255,255,255,0.75); }
    .login-link a { color:#00ff9c; text-decoration:none; }
    .confirmation-link { margin-top:18px; padding:15px; background: rgba(0,255,156,0.08); border:1px solid rgba(0,255,156,0.2); border-radius:6px; color:#a8ffb8; }
  </style>

  <script>
    const API_URL = '/api';

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const errorDiv = document.getElementById('forgotError');
      const successDiv = document.getElementById('forgotSuccess');
      const resetLinkDiv = document.getElementById('resetTokenLink');
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      resetLinkDiv.style.display = 'none';

      try {
        const response = await fetch(`${API_URL}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await response.json();

        if (!response.ok) {
          errorDiv.textContent = data.error || 'Errore invio richiesta';
          errorDiv.style.display = 'block';
          return;
        }

        successDiv.textContent = data.message || 'Richiesta inviata. Controlla il token qui sotto.';
        successDiv.style.display = 'block';

        if (data.resetToken) {
          resetLinkDiv.innerHTML = `Token reset: <code>${data.resetToken}</code><br><a href="reset-password.html?token=${encodeURIComponent(data.resetToken)}">Vai alla pagina di reset password</a>`;
          resetLinkDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'Errore di connessione: ' + err.message;
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
