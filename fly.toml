# Configurazione Fly.io per EVIL. Guida: docs/FLY-DEPLOY.md
app = "evil-projectevil"          # cambia se il nome è già preso
primary_region = "fra"            # Francoforte: la più vicina all'Italia

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  TRUST_PROXY = "1"               # Fly mette un proxy davanti al server
  FORCE_HTTPS = "1"
  # Produzione: dominio principale senza www (come su Render); www reindirizza qui.
  BASE_URL = "https://projectevil.it"
  COOKIE_DOMAIN = ".projectevil.it"
  CORS_ORIGINS = "https://projectevil.it,https://www.projectevil.it,https://evil-projectevil.fly.dev"
  EMAIL_USE_MAILTRAP_API = "1"
  SMTP_FROM_EMAIL = "noreply@projectevil.it"
  HELP_SUPPORT_EMAIL = "support@projectevil.it"
  DATA_DIR = "/data"              # solo cache (news): gli account stanno in Postgres

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"      # sempre acceso: serve all'aggiornamento orario delle news
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
